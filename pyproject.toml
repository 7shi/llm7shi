[project]
name = "llm7shi"
version = "0.15.1"
description = "A simplified Python library for interacting with large language models"
readme = "README.md"
license = { text = "CC0 1.0 Universal (CC0 1.0) Public Domain Dedication" }
repository = "https://github.com/7shi/llm7shi"
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "google-genai>=2.22.0",
    "ollama>=0.6.2",
    "openai>=3.7.0",
]

[project.optional-dependencies]
statusline = [
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm7shi"]
